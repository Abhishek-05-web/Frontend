<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
    <title>Weather_GPT</title>
</head>
<body>
    <header>
        <!-- Main header -->
        <div class="navbar">
            <!-- Logo -->
            <div class="nav-logo ">
                <div class="weather"></div>
            </div>
            <!-- Weather -->
            <div class="text1">
                <h1>Weather</h1>
            </div>
            <!-- GPT -->
            <div class="text2">
                <h1>GPT</h1>
            </div>
            <!-- Title -->
            <div class="title">
                <div id="t1"><a>Home</a></div>
                <div id="t2"><a>Forcast</a></div>
                <div id="t3"><a>Maps</a></div>
                <div id="t4"><a>Alerts</a></div>
                <div id="t5"><a>About</a></div>
            </div>
            <!-- Get Started -->
             <div class="text3">
                <h3>Get Started</h3>
             </div>
        </div>
    </header>
    <main>
        <!-- hero-content -->
        <div class="hero">
            <!-- Box1  -->
            <div class="Box1">
                <!-- Line1 -->
                <div id="Line1">
                    <h1>Your AI-Powered </h1>
                    <h1>Weather Assistant</h1>
                </div>
                 <!-- Line2 -->
                <div id="Line2">
                    <p>Get real-time forecasts, location insights, and smart recommendations.</p>
                </div>
                 <!-- Search -->
                <div class="search">
                    <!-- icon -->
                    <div id="icon"><i class="fa-solid fa-magnifying-glass"></i></div>
                    <!-- searchbar -->
                    <input placeholder="Search City,State">
                    <button>Analyze</button>
                </div>
            </div>
             <!-- Box2 -->
            <div class="Box2"></div>
        </div>
        <!-- Images -->
        <div class="image">
            <div id="Image1"></div>
            <div id="Image2"></div>
            <div id="Image3"></div>
            <div id="Image4"></div>
        </div>
    </main>
    <footer>
        <div class="footer">
            <div class="left">
                <div id="fline1"><h2>Weather GPT</h2></div>
                <div id="flin2"><p>Build for smart weather insights.</p></div>
            </div>
            <div class="btitle">
                <div id="bt1"><a>Home</a></div>
                <div id="bt2"><a>Forcast</a></div>
                <div id="bt3"><a>Maps</a></div>
                <div id="bt4"><a>Alerts</a></div>
                <div id="bt5"><a>About</a></div>
            </div>
        </div>
    </footer>
</body>
</html>
